# Include inside lowendaff.com's HTTPS server block. Do not expose this over HTTP.
# Astro endpoint headers are not retained when OpenResty serves static files.
charset utf-8;

location = /hooks/deploy-site {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    access_log off;
}

# Explicit HTTP redirects for published review aliases.
# Keep in sync with redirectFrom; enable only after destinations are deployed.
location = /reviews/100tb-cn2/ {
    return 301 https://lowendaff.com/reviews/100tb-%E7%BE%8E%E5%9B%BD%E6%B4%9B%E6%9D%89%E7%9F%B6-cn2-vps-%E6%B5%8B%E8%AF%95%E8%AE%B0%E5%BD%95-20261007/$is_args$args;
}
location = /reviews/100tb-cn2 {
    return 301 https://lowendaff.com/reviews/100tb-%E7%BE%8E%E5%9B%BD%E6%B4%9B%E6%9D%89%E7%9F%B6-cn2-vps-%E6%B5%8B%E8%AF%95%E8%AE%B0%E5%BD%95-20261007/$is_args$args;
}
